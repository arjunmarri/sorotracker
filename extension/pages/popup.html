<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SoroTrack</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    body { width: 300px; padding: 14px; }
    .status { display: flex; align-items: center; gap: 8px; margin: 12px 0; padding: 9px 11px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; }
    .status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stack { display: grid; gap: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .note { font-size: 12px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <div class="brand"><img src="../icons/icon-48.png" alt="">SoroTrack</div>
  <div class="status"><span class="dot connecting" id="dot"></span><span id="status">Connecting to your local model…</span></div>
  <div class="stack">
    <button class="btn primary" id="open">Open assistant on this page</button>
    <div class="row">
      <button class="btn" id="summarize">Summarize</button>
      <button class="btn" id="slop">Remove AI slop</button>
    </div>
    <div class="row">
      <button class="btn" id="snippets">Snippets</button>
      <button class="btn" id="settings">Settings</button>
    </div>
  </div>
  <p class="note muted" id="note">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>K</kbd></p>
  <script src="../shared/config.js"></script>
  <script src="../shared/snippets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
